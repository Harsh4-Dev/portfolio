<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <!--
    Repo-root bridge, only used when GitHub Pages is serving this repository as a *branch*
    (Settings -> Pages -> Source: "Deploy from a branch"), where the published root is the repo
    root and the site itself lives in site/.

    With Source: "GitHub Actions" — the intended setup — the workflow uploads only the site/
    folder, so this file is never part of the deployment and can be deleted.
  -->
  <link rel="canonical" href="site/">
  <meta http-equiv="refresh" content="0; url=site/">
  <style>
    html { background: #000; color: #fff; font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    a { color: #f2c86b; }
  </style>
</head>
<body>
  <p>loading the portfolio&hellip; <a href="site/">continue &rarr;</a></p>
  <script>location.replace('site/');</script>
</body>
</html>
