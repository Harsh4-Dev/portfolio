<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* classic one-column CV that also prints to A4 */
    body { background: var(--paper); }
    .cv-wrap { width: min(860px, 100% - 2rem); margin: 0 auto; padding: 5.5rem 0 4rem; position: relative; z-index: 2; }
    .cv-paper { background: var(--paper-light); border: 2px solid var(--ink); border-radius: 6px 10px 6px 12px; box-shadow: var(--shadow); padding: clamp(1.5rem, 5vw, 3.2rem); }
    .cv-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem 2rem; border-bottom: 2px solid var(--ink); padding-bottom: 1rem; margin-bottom: 1.4rem; }
    .cv-head h1 { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 2.8rem); margin: 0; line-height: 1.05; }
    .cv-head .tag { font-family: var(--font-hand); font-size: 1.35rem; color: var(--accent); margin: 0.2rem 0 0; }
    .cv-contact { text-align: right; font-size: 0.92rem; color: var(--ink-soft); line-height: 1.55; }
    .cv-contact a { text-decoration: none; }
    .cv-section { margin: 1.4rem 0 0; break-inside: avoid; }
    .cv-section h2 { font-family: var(--font-display); font-size: 1.25rem; letter-spacing: 0.02em; text-transform: uppercase; margin: 0 0 0.6rem; padding-bottom: 0.2rem; border-bottom: 1.5px solid var(--ink); display: flex; align-items: center; gap: 0.5rem; }
    .cv-section h2 .doodle { width: 1.3em; height: 1.3em; color: var(--accent); }
    .cv-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 1rem; margin-bottom: 0.8rem; break-inside: avoid; }
    .cv-entry .t { font-weight: 800; }
    .cv-entry .o { color: var(--accent-3); font-weight: 700; }
    .cv-entry .l { color: var(--ink-faint); font-size: 0.9rem; }
    .cv-entry .d { font-family: var(--font-hand); font-size: 1.1rem; color: var(--ink-soft); white-space: nowrap; }
    .cv-entry .desc { grid-column: 1 / -1; color: var(--ink-soft); font-size: 0.95rem; }
    .cv-entry .desc p, .cv-entry .desc ul { margin: 0.25em 0; } .cv-entry .desc ul { padding-left: 1.2em; }
    .cv-entry .tags { grid-column: 1 / -1; font-size: 0.88rem; color: var(--ink-soft); margin-top: 0.15rem; }
    .cv-entry .tags b { color: var(--ink); }
    .cv-tags p { margin: 0.2em 0; font-size: 0.95rem; }
    .cv-tags b { display: inline-block; min-width: 9em; }
    .cv-text p { margin: 0 0 0.6em; }
    .cv-stats { display: flex; flex-wrap: wrap; gap: 0.5rem 1.6rem; font-size: 0.95rem; }
    .cv-stats b { font-family: var(--font-hand); font-size: 1.3rem; color: var(--accent); }
    .cv-tools { position: fixed; top: 1rem; right: 1rem; z-index: 10; display: flex; gap: 0.6rem; }
    @media print {
      @page { size: A4; margin: 12mm; }
      body { background: #fff; font-size: 10.5pt; }
      #scene, .grain, .cv-tools { display: none !important; }
      .cv-wrap { width: 100%; padding: 0; }
      .cv-paper { border: 0; box-shadow: none; padding: 0; background: #fff; }
      a { color: inherit; text-decoration: none; }
      .cv-section h2 .doodle { display: none; }
    }
  </style>
</head>
<body class="cv">
  <div class="grain" aria-hidden="true"></div>
  <div class="cv-tools">
    <a class="btn btn-sm" href="index.html">← Portfolio</a>
    <button class="btn btn-sm btn-primary" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <main class="cv-wrap"><div class="cv-paper" id="cv"><div class="loading">loading…</div></div></main>
  <script type="module" src="assets/js/cv.js"></script>
</body>
</html>
